<svg fill="none" viewBox="0 0 800 120" width="100%" height="120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0a0a0a; }
    .border { stroke: #ef4444; stroke-width: 1; stroke-dasharray: 6 3; opacity: 0.3; }
    .text-main { font-family: 'Fira Code', 'Segoe UI', Monospace, sans-serif; font-weight: 600; font-size: 16px; fill: #ffffff; letter-spacing: 2px; }
    .text-sub { font-family: 'Fira Code', 'Segoe UI', Monospace, sans-serif; font-weight: 400; font-size: 13px; fill: #9ca3af; }
