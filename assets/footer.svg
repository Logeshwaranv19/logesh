  <rect width="800" height="120" rx="8" class="bg" />
  <rect x="8" y="8" width="784" height="104" rx="6" class="border" />

  <g transform="translate(400, 55)" text-anchor="middle">
    <text class="text-main">THANK YOU FOR VISITING <tspan class="accent">MY PROFILE</tspan> 👋</text>
    <text y="30" class="text-sub">Designed &amp; Built by <tspan class="accent">Logeshwaran V</tspan> | Salem, Tamil Nadu, India</text>
