<svg fill="none" viewBox="0 0 720 100" width="100%" height="100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0a0a0a; }
    .border { stroke: #ef4444; stroke-width: 1; opacity: 0.3; }
    .quote-text { font-family: 'Fira Code', 'Segoe UI', Monospace, sans-serif; font-style: italic; font-weight: 500; font-size: 15px; fill: #e5e7eb; }
    .quote-author { font-family: 'Fira Code', 'Segoe UI', Monospace, sans-serif; font-weight: 600; font-size: 13px; fill: #ef4444; }
    .accent { fill: #ef4444; }
  </style>

  <rect width="720" height="100" rx="8" class="bg" />
  <rect x="5" y="5" width="710" height="90" rx="6" class="border" />

  <g transform="translate(360, 45)" text-anchor="middle">
    <text class="quote-text">
      <tspan class="accent">"</tspan>Code is like humor. When you have to explain it, it’s bad.<tspan class="accent">"</tspan>
    </text>
    <text y="30" class="quote-author">— Cory House</text>
  </g>
</svg>
